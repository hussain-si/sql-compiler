<style>
:root{
  color-scheme:light;
  --paper:#f6f4ef; --panel:#ffffff; --panel-soft:#f8fafc; --ink:#0d141f; --muted:#526172;
  --line:rgba(13,23,35,.13); --line-h:rgba(13,23,35,.28); --accent:#1c7ed6; --ring:rgba(28,126,214,.22);
  --go:#0b7a5a; --go-h:#096a4e; --on-go:#ffffff; --bad:#c92a2a; --chip:rgba(13,23,35,.06);
  --shadow:0 18px 40px rgba(13,23,35,.12);
  --ground:radial-gradient(circle at 12% 0%,rgba(28,126,214,.10),transparent 55%),radial-gradient(circle at 88% 4%,rgba(18,184,134,.08),transparent 50%);
  --ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:'Space Grotesk','IBM Plex Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0b0f14; --panel:#111823; --panel-soft:#0f1722; --ink:#e6edf5; --muted:#a6b2c1;
    --line:rgba(255,255,255,.13); --line-h:rgba(255,255,255,.28); --accent:#62a5ff; --ring:rgba(98,165,255,.25);
    --go:#34d399; --go-h:#5ee0ae; --on-go:#052e1f; --bad:#ff8787; --chip:rgba(255,255,255,.08);
    --shadow:0 18px 40px rgba(0,0,0,.45);
    --ground:radial-gradient(circle at 12% 0%,rgba(98,165,255,.15),transparent 55%),radial-gradient(circle at 88% 4%,rgba(61,220,151,.09),transparent 50%);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0b0f14; --panel:#111823; --panel-soft:#0f1722; --ink:#e6edf5; --muted:#a6b2c1;
  --line:rgba(255,255,255,.13); --line-h:rgba(255,255,255,.28); --accent:#62a5ff; --ring:rgba(98,165,255,.25);
  --go:#34d399; --go-h:#5ee0ae; --on-go:#052e1f; --bad:#ff8787; --chip:rgba(255,255,255,.08);
  --shadow:0 18px 40px rgba(0,0,0,.45);
  --ground:radial-gradient(circle at 12% 0%,rgba(98,165,255,.15),transparent 55%),radial-gradient(circle at 88% 4%,rgba(61,220,151,.09),transparent 50%);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;padding:16px;font:14px/1.5 var(--ui);color:var(--ink);
  background:var(--paper);background-image:var(--ground);-webkit-font-smoothing:antialiased}
.card{width:min(540px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px 22px 16px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.brand i{flex:none;display:grid;place-items:center;min-width:42px;height:42px;padding:0 9px;border-radius:12px;
  background:linear-gradient(135deg,#0d141f,#00465a 55%,#00758f);color:#eef6ff;font:700 13px/1 var(--display);font-style:normal;letter-spacing:.02em}
.brand b{display:block;font:700 18px/1.2 var(--display);letter-spacing:-.02em}
.brand small{display:block;color:var(--muted);font-size:12.5px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.pw{position:relative}
input{width:100%;height:38px;padding:0 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel-soft);
  color:var(--ink);font:14px var(--ui);outline:none}
input:hover{border-color:var(--line-h)}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring);background:var(--panel)}
.pw input{padding-right:58px}
.eye{position:absolute;right:5px;top:5px;height:28px;padding:0 9px;border:0;border-radius:7px;background:transparent;
  color:var(--muted);font:600 11.5px var(--ui);cursor:pointer}
.eye:hover,.eye:focus-visible{color:var(--ink);background:var(--chip);outline:none}
.go{margin-top:12px;width:100%;height:40px;border:0;border-radius:11px;background:var(--go);color:var(--on-go);
  font:700 14px var(--ui);cursor:pointer}
.go:hover{background:var(--go-h)}
.go:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring)}
.go:disabled{opacity:.72;cursor:progress}
.msg{min-height:20px;margin:9px 0 0;font-size:12.5px;color:var(--muted)}
.msg.bad{color:var(--bad);font-weight:600}
.card.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.opening{display:none;margin:0;color:var(--muted);font-size:13px}
.resume .card{display:none}
.resume .opening{display:block}
@media (max-width:480px){ .row{grid-template-columns:1fr} .card{padding:18px 16px 14px} }
@media (prefers-reduced-motion:reduce){ .card.shake{animation:none} }
</style>

  const SKEY = 'compiler-login:v1';
  const root = document.documentElement;
  const $ = id => document.getElementById(id);
  const enc = new TextEncoder();
  const subtle = window.crypto && window.crypto.subtle;
  const unb64 = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
  const b64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
  const norm = s => String(s).normalize('NFC').trim();
  /* every account signed in with in this tab, newest first: each compiler has its own list,
     so each page opens with whichever of them it knows */
  const session = {
    get() {
      try {
        const v = JSON.parse(sessionStorage.getItem(SKEY) || 'null');
        return v && Array.isArray(v.keys) ? v.keys : v && v.k ? [{u: v.u, k: v.k}] : [];
      } catch (e) { return []; }
    },
    add(u, k) {
      const keys = [{u, k}, ...session.get().filter(x => x.k !== k)].slice(0, 20);
      try { sessionStorage.setItem(SKEY, JSON.stringify({keys})); } catch (e) {}
    },
    clear() { try { sessionStorage.removeItem(SKEY); } catch (e) {} }
  };
  const form = $('form'), user = $('user'), pass = $('pass'), go = $('go'), msg = $('msg'), card = $('card');

  function say(text, bad) { msg.textContent = text; msg.classList.toggle('bad', !!bad); }
  function showForm() { root.classList.remove('resume'); if (!user.value) user.focus(); else pass.focus(); }

  /* the same key the build script derives for this username + password */
  async function userKey(name, password) {
    const salt = new Uint8Array(await subtle.digest('SHA-256', enc.encode(C.salt + '\n' + name)));
    const base = await subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await subtle.deriveBits({name: 'PBKDF2', hash: 'SHA-256', salt, iterations: C.iter}, base, 256));
  }
  /* a user's key opens exactly one of the wrapped copies of this page's key */
  async function pageKey(raw) {
    const k = await subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    for (const w of C.keys) {
      try { return new Uint8Array(await subtle.decrypt({name: 'AES-GCM', iv: unb64(w.iv)}, k, unb64(w.ct))); } catch (e) { /* not this one */ }
    }
    return null;
  }
  /* document.open() is ignored while this page is still being parsed, which is when a
     returning visitor's stored key finishes decrypting — so wait for the parse to end */
  const parsed = () => document.readyState !== 'loading' ? Promise.resolve() : new Promise(r => document.addEventListener('DOMContentLoaded', r, {once: true}));
  async function openPage(key, who) {
    const k = await subtle.importKey('raw', key, 'AES-GCM', false, ['decrypt']);
    const html = new TextDecoder().decode(await subtle.decrypt({name: 'AES-GCM', iv: unb64(C.iv)}, k, unb64(C.data)));
    await parsed();
    document.open();
    document.write(html);
    document.close();
    addSignOut(who);
  }
  function addSignOut(who) {
    const theme = document.getElementById('theme');
    const b = document.createElement('button');
    b.type = 'button'; b.id = 'signOut'; b.className = theme ? theme.className : '';
    b.textContent = 'Sign out';
    b.title = `Signed in as ${who}. Signs you out of every playground in this tab.`;
    b.addEventListener('click', () => { session.clear(); location.reload(); });
    if (theme && theme.parentNode) theme.parentNode.insertBefore(b, theme);
    else { b.style.cssText = 'position:fixed;right:12px;bottom:12px;z-index:99999;padding:6px 12px;border-radius:9px;font:600 12px system-ui,sans-serif'; document.body.appendChild(b); }
  }

  $('eye').addEventListener('click', () => {
    const show = pass.type === 'password';
    pass.type = show ? 'text' : 'password';
    $('eye').textContent = show ? 'Hide' : 'Show';
    $('eye').setAttribute('aria-pressed', String(show));
    pass.focus();
  });

  let busy = false;
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (busy) return;
    const shown = norm(user.value), name = shown.toLowerCase(), password = norm(pass.value);
    if (!name || !password) { say(!name ? 'Enter your username.' : 'Enter your password.', true); (!name ? user : pass).focus(); return; }
    busy = true; go.disabled = true; go.textContent = 'Signing in…'; say('Checking…');
    try {
      const raw = await userKey(name, password);
      const key = await pageKey(raw);
      if (!key) {
        await new Promise(r => setTimeout(r, 450));
        say('Wrong username or password.', true);
        card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
        pass.select();
        return;
      }
      session.add(shown, b64(raw));
      say('Opening…');
      await openPage(key, shown);
    } catch (err) {
      say('Could not open the page: ' + (err && err.message || err), true);
    } finally {
      busy = false; go.disabled = false; go.textContent = 'Sign in';
    }
  });

  (async () => {
    if (!subtle) {
      root.classList.remove('resume');
      form.querySelectorAll('input,button').forEach(el => { el.disabled = true; });
      say('Sign-in needs a secure page. Open it from https:// or as a file on this computer.', true);
      return;
    }
    for (const s of session.get()) {
      try { const key = await pageKey(unb64(s.k)); if (key) { await openPage(key, s.u || 'you'); return; } } catch (e) { /* try the next one */ }
    }
    showForm();
  })();
})();
